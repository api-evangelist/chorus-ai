- status: 404
  component: NotFound
  title: Not found
  operations: 25
  meaning: >-
    The addressed resource does not exist, OR the authenticated user's data-access-control
    settings exclude it. Chorus documents that private recordings are simply not returned, so a
    404 is not proof of absence — it may be an authorization outcome presented as absence.
  remediation: >-
    Verify the id, then verify the token user's roles & permissions and recording access scope
    before concluding the resource is gone.
