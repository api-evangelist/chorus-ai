summary: >-
  Chorus returns a JSON:API error document, not RFC 9457 problem+json. Every 4xx in the contract
  resolves to one of three shared component responses (BadRequest, NotFound, Conflict), all of
  which carry the same components.schemas.Error body under media type application/vnd.api+json.
  There is no published error-code registry, so the `code` field is present in the schema but
  unenumerated — an agent cannot branch on it from the contract alone.
