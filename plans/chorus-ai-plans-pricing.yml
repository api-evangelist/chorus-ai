description: >-
  Chorus publishes NO public pricing. This is a verified zero, not a gap in our research: the
  earlier scaffold in this file has been replaced with the researched result.
notes: >-
  https://www.chorus.ai/pricing returns HTTP 200 but the body is a ten-line meta-refresh shell
  that forwards to https://www.zoominfo.com/products/chorus/pricing. Chorus.ai was acquired by
  ZoomInfo in 2021 and the entire chorus.ai marketing site is now redirect-only, so ZoomInfo's
  page is the governing pricing surface. That page publishes no tier names, no per-seat prices,
  no included quota and no API-specific pricing — it is a demo-request/contact-sales funnel.
  ZoomInfo's general pricing page (https://www.zoominfo.com/pricing) answers 403 to a scripted
  request. There is no self-serve signup and no published API metering, which is consistent with
  the API's own token-issuance path: the published documentation states that a personal API token
  must be obtained by contacting your Chorus customer success manager.
