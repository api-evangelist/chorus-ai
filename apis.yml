aid: chorus-ai
url: https://raw.githubusercontent.com/api-evangelist/chorus-ai/refs/heads/main/apis.yml
name: Chorus.ai
kind: company
description: >-
  Chorus.ai is a conversation intelligence platform, acquired by ZoomInfo in 2021 and sold as
  "Chorus by ZoomInfo", that records, transcribes and analyzes customer-facing calls, meetings
  and emails to surface deal insights and coach sales reps. It publishes a single public REST
  contract — the Chorus API, an OpenAPI 3.0.3 document with 81 operations served unauthenticated
  at https://chorus.ai/api/openapi.json — covering engagement search, recording upload and media
  retrieval, coaching moments and playlists, scorecards, AI sales-qualification analysis with CRM
  writeback, and webhook registration. The API is JSON:API shaped on its /api/v1 surface with an
  older flat /v3 surface alongside it. Notably, the chorus.ai marketing site has been retired to
  a redirect shell pointing at zoominfo.com, but the API and both of its documentation surfaces
  remain live on the original domain.
accessModel:
  pricing: enterprise
  onboarding: sales-gated
  trial: false
  try_now: false
  public: false
  label: Enterprise / Contact Sales
  confidence: high
  source:
  - plans
  - openapi
  - pricing-page
  note: >-
    No public pricing and no self-serve signup. The published API documentation states that an
    API token must be obtained through a Chorus customer success manager.
  generated: '2026-08-13'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/chorus-ai.png
tags:
- Sales
- Revenue Intelligence
- Conversation
- Analytics
- ZoomInfo
- Conversation Intelligence
- Sales Enablement
- Call Recording
- Transcription
- Speech Analytics
- CRM
- Coaching
created: '2026-05-08'
