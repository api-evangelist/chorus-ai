method: searched
source: >-
  openapi/_original/chorus-ai-openapi.json + https://chorus.ai/api-docs/index.html +
  https://status.chorus.ai/ + https://status.zoominfo.com/
summary: >-
  Chorus publishes a versioned API but no versioning policy, no deprecation policy and no
  changelog. Two non-aligned path versions (/api/v1 and /v3) are served concurrently with no
  statement about which supersedes which. Post-acquisition, the operational surfaces have moved
  to ZoomInfo: status.chorus.ai no longer serves a status page, it meta-refreshes to
  zoominfo.com/products/chorus, and the real status page is status.zoominfo.com.
versioning:
  style: uri path
  versions:
  - path: /api/v1
    operations: 60
    shape: JSON:API (application/vnd.api+json, page[]/filter[]/fields[])
    status: current
  - path: /v3
    operations: 8
    shape: flat query parameters, continuation_key cursor
    status: current
    note: >-
      Despite the higher number, /v3 is the older, flatter surface — it carries the original
      engagements/users/upload/webhook endpoints and is the one demonstrated in the published
      authentication example.
  - path: /login, /api/auth/*
    operations: 2
    shape: session/web
    status: current
  document_version: 26.33.08
  document_version_scheme: >-
    Calendar/build-shaped (YY.WW.BB), not semantic. It is not referenced by any published policy
    and there is no way for a consumer to map it to a change.
  policy_published: false
  policy_url: null
  note: >-
    No statement anywhere in the contract or docs explains the relationship between /api/v1 and
    /v3, which one new integrations should target, or whether either is frozen.
