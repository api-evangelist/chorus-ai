openapi: 3.2.0
info:
  description: The Chorus API is a REST API that enables you to retrieve information from and perform actions in Chorus.
  termsOfService: https://www.chorus.ai/terms
  title: Chorus Public External Moments API
  version: 26.33.08
servers:
- url: /
- url: https://chorus.ai
security:
- basic: []
- bearer-token: []
- x-ziaccesstoken: []
tags:
- name: Public External Moments
paths:
  /api/v1/moments:
    post:
      deprecated: false
      description: This API creates a new moment.
      operationId: post-api-v1-moments
      parameters: []
      requestBody:
        content:
          application/vnd.api+json:
            example:
              data:
                attributes:
                  callid: call_id_12345
                  moment_duration: 7
                  moment_time: 0.0
                  note: ''
                  subject: ''
                  url_string: ''
                type: moment_create_request
            schema:
              $ref: '#/components/schemas/MomentCreateRequestForCreateDoc'
        required: true
      responses:
        '201':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MomentDoc'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      summary: Add a new moment
      tags:
      - Public External Moments
  /api/v1/moments/{id}:
    put:
      deprecated: false
      description: Updates a moment with the specified ID.
      operationId: put-api-v1-moments-id
      parameters:
      - description: id
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/vnd.api+json:
            example:
              data:
                attributes:
                  moment_time: 3.0
                  note: ''
                  subject: ''
                  url_string: ''
                id: '11111'
                type: moment_edit_request
            schema:
              $ref: '#/components/schemas/MomentEditRequestDoc'
        required: true
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MomentDoc'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Updates a moment by ID
      tags:
      - Public External Moments
