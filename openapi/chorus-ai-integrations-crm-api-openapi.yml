openapi: 3.2.0
info:
  description: The Chorus API is a REST API that enables you to retrieve information from and perform actions in Chorus.
  termsOfService: https://www.chorus.ai/terms
  title: Chorus Integrations CRM API
  version: 26.33.08
servers:
- url: /
- url: https://chorus.ai
security:
- basic: []
- bearer-token: []
- x-ziaccesstoken: []
tags:
- name: Integrations CRM
paths:
  /api/v1/integrations/unie/actions/connect:
    get:
      deprecated: false
      description: This API is used to "connect" the customer to OAuth2 Unie CRM login
      operationId: get-api-v1-integrations-unie-actions-connect
      parameters:
      - description: The customer's vendor instance URL.
        in: query
        name: resource
        required: false
        schema:
          type: string
      - description: The requested crm provider.
        in: query
        name: provider
        required: true
        schema:
          enum:
          - DYNAMICS
          - HUBSPOT
          - SALESFORCE
          - MARKETO
          type: string
      responses:
        '307':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Connect customer to Unie
      tags:
      - Integrations CRM
components:
  responses:
    BadRequest:
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request
  schemas:
    Error:
      properties:
        errors:
          items:
            properties:
              code:
                type:
                - string
                - 'null'
              detail:
                type:
                - string
                - 'null'
              id:
                type:
                - string
                - 'null'
              source:
                properties:
                  cookie:
                    type:
                    - string
                    - 'null'
                  header:
                    type:
                    - string
                    - 'null'
                  parameter:
                    type:
                    - string
                    - 'null'
                  path:
                    type:
                    - string
                    - 'null'
                  pointer:
                    type:
                    - string
                    - 'null'
                type:
                - object
                - 'null'
              status:
                type:
                - string
                - 'null'
              title:
                type:
                - string
                - 'null'
            type: object
          type: array
      required:
      - errors
      type: object
  securitySchemes:
    basic:
      description: HTTP basic authentication (for those APIs that support it).
      scheme: basic
      type: http
    bearer-token:
      description: A Chorus token or a signed JWT.
      scheme: bearer
      type: http
    x-ziaccesstoken:
      description: A ZoomInfo access token.
      in: header
      name: x-ziaccesstoken
      type: apiKey
