openapi: 3.2.0
info:
  description: The Chorus API is a REST API that enables you to retrieve information from and perform actions in Chorus.
  termsOfService: https://www.chorus.ai/terms
  title: Chorus Auth API
  version: 26.33.08
servers:
- url: /
- url: https://chorus.ai
security:
- basic: []
- bearer-token: []
- x-ziaccesstoken: []
tags:
- name: Auth
paths:
  /api/auth/signed_request:
    post:
      deprecated: false
      description: This API returns a signed request authentication response based on the HMAC authentication flow
      operationId: post-api-auth-signed_request
      parameters: []
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SignedRequestForCreateDoc'
        required: true
      responses:
        '201':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SignedRequestResponseDoc'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      summary: Signed request authentication flow
      tags:
      - Auth
components:
  schemas:
    SignedRequestForCreateDoc:
      properties:
        data:
          $ref: '#/components/schemas/SignedRequestForCreate'
      required:
      - data
      type: object
    Error:
      properties:
        errors:
          items:
            properties:
              code:
                type:
                - string
                - 'null'
              detail:
                type:
                - string
                - 'null'
              id:
                type:
                - string
                - 'null'
              source:
                properties:
                  cookie:
                    type:
                    - string
                    - 'null'
                  header:
                    type:
                    - string
                    - 'null'
                  parameter:
                    type:
                    - string
                    - 'null'
                  path:
                    type:
                    - string
                    - 'null'
                  pointer:
                    type:
                    - string
                    - 'null'
                type:
                - object
                - 'null'
              status:
                type:
                - string
                - 'null'
              title:
                type:
                - string
                - 'null'
            type: object
          type: array
      required:
      - errors
      type: object
    SignedRequestResponseDoc:
      properties:
        data:
          $ref: '#/components/schemas/SignedRequestResponse'
      required:
      - data
      type: object
    SignedRequestForCreate:
      properties:
        attributes:
          properties:
            client_id:
              type: string
            redirect:
              type: boolean
            signed_request:
              type: string
          required:
          - client_id
          - signed_request
          - redirect
          type: object
        type:
          description: The type of resource.
          enum:
          - signed_request
          example: signed_request
          title: Type
          type: string
      required:
      - attributes
      - type
      type: object
    SignedRequestResponse:
      properties:
        attributes:
          properties:
            expiry:
              type: integer
            url:
              type: string
          required:
          - url
          - expiry
          type: object
        id:
          description: The unique ID of the signed request response.
          example: '123'
          title: ID
          type: string
        type:
          description: The type of resource.
          enum:
          - signed_request_response
          example: signed_request_response
          title: Type
          type: string
      required:
      - attributes
      - type
      - id
      type: object
  responses:
    BadRequest:
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request
    Conflict:
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Conflict
  securitySchemes:
    basic:
      description: HTTP basic authentication (for those APIs that support it).
      scheme: basic
      type: http
    bearer-token:
      description: A Chorus token or a signed JWT.
      scheme: bearer
      type: http
    x-ziaccesstoken:
      description: A ZoomInfo access token.
      in: header
      name: x-ziaccesstoken
      type: apiKey
