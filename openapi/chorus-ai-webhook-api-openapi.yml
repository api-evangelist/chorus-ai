openapi: 3.2.0
info:
  description: The Chorus API is a REST API that enables you to retrieve information from and perform actions in Chorus.
  termsOfService: https://www.chorus.ai/terms
  title: Chorus Webhook API
  version: 26.33.08
servers:
- url: /
- url: https://chorus.ai
security:
- basic: []
- bearer-token: []
- x-ziaccesstoken: []
tags:
- name: Webhook
paths:
  /v3/webhook:
    delete:
      deprecated: false
      description: Delete an existing webhook by its URL.
      operationId: delete-v3-webhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                hook_url:
                  description: The URL of the webhook to delete
                  type: string
              required:
              - hook_url
              type: object
        required: true
      responses:
        '200':
          content:
            application/json: {}
          description: Success
      summary: Delete a webhook
      tags:
      - Webhook
    get:
      deprecated: false
      description: Retrieve all webhooks configured for the authenticated customer.
      operationId: get-v3-webhook
      parameters: []
      responses:
        '200':
          content:
            application/json:
              example:
                webhooks:
                - events:
                  - event_name: recording_done
                    filter_arguments:
                      es_args:
                        duration_min: 60
                  id: 123
                  url: https://example.com/webhook
          description: Success
      summary: Fetch webhooks
      tags:
      - Webhook
    post:
      deprecated: false
      description: Register a new webhook that Chorus will post to when a specified event occurs. Webhooks can be filtered based on conversation criteria.
      operationId: post-v3-webhook
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                event:
                  description: The event type that triggers the webhook
                  enum:
                  - recording_done
                  type: string
                hook_url:
                  description: The URL to post to when the event occurs
                  type: string
                type:
                  description: Optional webhook type with predefined filters (e.g., 'zapier' for common Zapier use cases)
                  type:
                  - string
                  - 'null'
              required:
              - event
              - hook_url
              type: object
        required: true
      responses:
        '200':
          content:
            application/json: {}
          description: Success
      summary: Register a webhook
      tags:
      - Webhook
components:
  securitySchemes:
    basic:
      description: HTTP basic authentication (for those APIs that support it).
      scheme: basic
      type: http
    bearer-token:
      description: A Chorus token or a signed JWT.
      scheme: bearer
      type: http
    x-ziaccesstoken:
      description: A ZoomInfo access token.
      in: header
      name: x-ziaccesstoken
      type: apiKey
