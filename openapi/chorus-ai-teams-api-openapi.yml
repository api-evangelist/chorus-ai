openapi: 3.2.0
info:
  description: The Chorus API is a REST API that enables you to retrieve information from and perform actions in Chorus.
  termsOfService: https://www.chorus.ai/terms
  title: Chorus Teams API
  version: 26.33.08
servers:
- url: /
- url: https://chorus.ai
security:
- basic: []
- bearer-token: []
- x-ziaccesstoken: []
tags:
- name: Teams
paths:
  /api/v1/teams:
    get:
      deprecated: false
      description: This API fetches all teams.
      operationId: get-api-v1-teams
      parameters: []
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamsDoc'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: Fetch teams
      tags:
      - Teams
  /api/v1/teams/{id}:
    get:
      deprecated: false
      description: This API fetches the team with the given ID.
      operationId: get-api-v1-teams-id
      parameters:
      - description: id
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamDoc'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Fetch a specific team
      tags:
      - Teams
components:
  schemas:
    TeamDoc:
      properties:
        data:
          $ref: '#/components/schemas/Team'
      required:
      - data
      type: object
    TeamsDoc:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Team'
          type: array
      required:
      - data
      type: object
    Error:
      properties:
        errors:
          items:
            properties:
              code:
                type:
                - string
                - 'null'
              detail:
                type:
                - string
                - 'null'
              id:
                type:
                - string
                - 'null'
              source:
                properties:
                  cookie:
                    type:
                    - string
                    - 'null'
                  header:
                    type:
                    - string
                    - 'null'
                  parameter:
                    type:
                    - string
                    - 'null'
                  path:
                    type:
                    - string
                    - 'null'
                  pointer:
                    type:
                    - string
                    - 'null'
                type:
                - object
                - 'null'
              status:
                type:
                - string
                - 'null'
              title:
                type:
                - string
                - 'null'
            type: object
          type: array
      required:
      - errors
      type: object
    Team:
      properties:
        attributes:
          properties:
            default:
              type:
              - boolean
              - 'null'
            description:
              type:
              - string
              - 'null'
            include_descendant_teams:
              type:
              - boolean
              - 'null'
            language:
              type: string
            manager:
              type:
              - integer
              - 'null'
            name:
              type: string
            parent_team:
              readOnly: true
              type:
              - integer
              - 'null'
            users:
              items:
                type: integer
              type: array
          required:
          - language
          - name
          - users
          type: object
        id:
          description: The unique ID of the team.
          example: '123'
          title: ID
          type: string
        type:
          description: The type of resource.
          enum:
          - team
          example: team
          title: Type
          type: string
      required:
      - attributes
      - type
      - id
      type: object
  responses:
    BadRequest:
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request
    NotFound:
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not found
  securitySchemes:
    basic:
      description: HTTP basic authentication (for those APIs that support it).
      scheme: basic
      type: http
    bearer-token:
      description: A Chorus token or a signed JWT.
      scheme: bearer
      type: http
    x-ziaccesstoken:
      description: A ZoomInfo access token.
      in: header
      name: x-ziaccesstoken
      type: apiKey
